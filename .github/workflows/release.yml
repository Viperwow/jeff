name: Release

# A feat or fix merged into main makes a vX.Y.Z release with binaries for Linux, macOS and Windows.
on:
  push:
    branches: [main]

permissions:
  contents: read

# A cancelled run leaves the new vX.Y.Z release a draft; re-run its failed jobs to publish it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # semantic-release pushes the release commit and tag, and comments on released issues and PRs.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

  build:
    needs: version
    if: needs.version.outputs.tag
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The release commit carries the new version number.
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=jeff-${{ needs.version.outputs.tag }}-${{ matrix.target }}
          mkdir -p dist "$name"
          cp README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/jeff.exe "$name/"
            7z a -bd "dist/$name.zip" "$name" > /dev/null
          else
            cp target/${{ matrix.target }}/release/jeff "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      # semantic-release leaves the release a draft, so it goes public only with every binary attached.
      - name: Attach to the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release upload ${{ needs.version.outputs.tag }} * --repo ${{ github.repository }} --clobber
          gh release edit ${{ needs.version.outputs.tag }} --draft=false --latest --repo ${{ github.repository }}
